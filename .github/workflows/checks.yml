name: Repository checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  repository-checks:
    name: repository-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check source, links, assets and publication boundaries
        run: python3 scripts/check_repository.py
      - name: Check shell and Lua syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit
          find launcher scripts -name '*.sh' -exec sh -n {} \;
          find app scripts tests -name '*.lua' -print0 | while IFS= read -r -d '' f; do luajit -b "$f" /tmp/yomigami-bytecode; done
